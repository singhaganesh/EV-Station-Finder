spring.application.name=station-finder-backend

# Local-only secret file (gitignored, not shipped). Devs put real DB/Redis/JWT/OCM
# values here OR in environment variables. NOTHING secret lives in src/main/resources.
spring.config.import=optional:file:./application-local.properties

# Server Configuration
server.port=8081
server.address=0.0.0.0

# Database Configuration (PostgreSQL / Supabase) -- environment variables only, no defaults
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Keep within Supabase pooler connection budget
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# JPA & Hibernate Configuration
# Schema is owned by Flyway. Hibernate only validates the mapping (never mutates the schema).
# Override with DDL_AUTO=update only when bootstrapping a brand-new empty local database.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# Flyway (schema migrations). Adopts the existing Hibernate-created schema via baseline.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Supabase JWT (Resource Server) -- environment variables only
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_ISSUER_URI}

# Admin allowlist (comma-separated emails). Empty by default -- set ADMIN_EMAILS in the environment.
app.admin.emails=${ADMIN_EMAILS:}

# Response Compression (GZIP)
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024

# OCM (OpenChargeMap) Configuration -- key from environment only
ocm.api.key=${OCM_API_KEY}
ocm.sync.enabled=${OCM_SYNC_ENABLED:true}
ocm.sync.radius-km=500
ocm.sync.country-id=101
ocm.sync.interval-cron=0 0 3 * * ?

# Seeding Configuration
app.seeding.enabled=${APP_SEEDING_ENABLED:false}

# Redis Configuration (Upstash) -- full rediss:// URL from environment only
spring.data.redis.url=${REDIS_URL}

# Rate limiting (per client IP for public reads; per user for writes)
app.ratelimit.enabled=${RATELIMIT_ENABLED:true}
app.ratelimit.public-per-minute=${RATELIMIT_PUBLIC:60}
app.ratelimit.write-per-minute=${RATELIMIT_WRITE:20}
app.ratelimit.review-per-minute=${RATELIMIT_REVIEW:5}

# External HTTP client timeouts (ms) for OCM / Nominatim / OSRM
app.http.connect-timeout-ms=${HTTP_CONNECT_TIMEOUT:3000}
app.http.read-timeout-ms=${HTTP_READ_TIMEOUT:5000}
